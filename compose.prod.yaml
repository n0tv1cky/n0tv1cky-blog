version: '3.9'
services:
  postgres:
    image: postgres:15
    container_name: ${POSTGRES_CONTAINER_NAME:-postgres}
    restart: always
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - blognet

  backend:
    build: ./services/backend
    container_name: ${BACKEND_CONTAINER_NAME:-blog_backend}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./services/backend/app:/app/app
      - ./blogs:/app/blogs
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - blognet

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile.prod
    container_name: ${FRONTEND_CONTAINER_NAME:-blog_frontend}
    # In production we build the image and do not bind-mount source
    env_file:
      - .env.prod
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_URL: ${BACKEND_URL}
      # Client-side requests must use the backend URL from environment
      NEXT_PUBLIC_BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE}
      NEXT_PUBLIC_ADMIN_TOKEN: ${ADMIN_TOKEN}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - blognet

volumes:
  pgdata_prod:

networks:
  blognet:
    driver: bridge
