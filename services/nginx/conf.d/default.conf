server {
    listen 80;
    server_name n0tv1cky.com www.n0tv1cky.com;

    # Redirect ACME and then other traffic to HTTPS when certs are present
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server (expects SSL certs at /etc/letsencrypt/live/n0tv1cky.com/)
server {
    listen 443 ssl http2;
    server_name n0tv1cky.com www.n0tv1cky.com;

    ssl_certificate /etc/letsencrypt/live/n0tv1cky.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n0tv1cky.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Redirect /.well-known for ACME if needed
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Serve frontend static files
    # When running nginx on the host (non-Docker) we expect the frontend
    # to be reachable on localhost:3000. If you run frontend elsewhere,
    # update the upstreams accordingly.
    location /_next/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API to backend
    # Backend is expected to listen on localhost:8000 when running on the host.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images served from backend static files
    location /images/ {
        proxy_pass http://127.0.0.1:8000/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback to frontend (Next.js will handle routing)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
